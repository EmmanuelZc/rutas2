<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visualización de Rutas y Paradas | Panel de Visualizador</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <style>
      :root {
        --sidebar-width: 250px;
        --primary-color: #3498db;
        --secondary-color: #2c3e50;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f5f7fa;
      }

      .sidebar {
        width: var(--sidebar-width);
        height: 100vh;
        position: fixed;
        left: 0;
        top: 0;
        background-color: var(--secondary-color);
        color: white;
        padding: 20px 0;
        box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        transition: all 0.3s;
        z-index: 1000;
      }

      .sidebar-header {
        padding: 0 20px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .sidebar-menu {
        padding: 20px 0;
      }

      .sidebar-menu a {
        display: block;
        padding: 12px 20px;
        color: rgba(255, 255, 255, 0.8);
        text-decoration: none;
        transition: all 0.3s;
        border-left: 3px solid transparent;
      }

      .sidebar-menu a:hover,
      .sidebar-menu a.active {
        background-color: rgba(255, 255, 255, 0.1);
        color: white;
        border-left: 3px solid var(--primary-color);
      }

      .sidebar-menu i {
        margin-right: 10px;
        font-size: 1.1rem;
      }

      .main-content {
        margin-left: var(--sidebar-width);
        padding: 30px;
        min-height: 100vh;
      }

      .table-responsive {
        border-radius: 10px;
        overflow: hidden;
      }

      .table {
        width: 100%;
        border-spacing: 0;
        border-collapse: collapse;
      }

      .table thead {
        background-color: var(--primary-color);
        color: white;
        text-align: left;
      }

      .table th,
      .table td {
        padding: 12px 15px;
        border: 1px solid #ddd;
      }

      .table tbody tr:nth-child(even) {
        background-color: #f9f9f9;
      }

      .table tbody tr:hover {
        background-color: rgba(52, 152, 219, 0.1);
        cursor: pointer;
      }

      .btn-visualizar {
        display: none;
      }

      .toggle-sidebar {
        display: none;
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 1100;
        background: var(--secondary-color);
        color: white;
        border: none;
        border-radius: 5px;
        padding: 5px 10px;
      }
    </style>
  </head>
  <body>
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h4 class="text-center">Panel de Visualización</h4>
      </div>
      <div class="sidebar-menu">
        <a href="" class="active">
          <i class="bi bi-speedometer2"></i> Dashboard
        </a>

        <a href="#" onclick="logout(event)">
          <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
        </a>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <h2 class="mb-4">Gestión de Rutas y Paradas</h2>

      <!-- Rutas -->
      <div class="card mb-4">
        <div class="card-header">
          <h5>Rutas</h5>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover mb-0" id="tablaRutas">
              <thead>
                <tr>
                  <th width="80">ID</th>
                  <th>Nombre</th>
                  <th>Horario</th>
                  <th>Estado</th>
                </tr>
              </thead>
              <tbody>
                <!-- Las filas de la tabla de rutas se agregarán dinámicamente -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Paradas -->
      <div class="card mb-4">
        <div class="card-header">
          <h5>Paradas</h5>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover mb-0" id="tablaParadas">
              <thead>
                <tr>
                  <th width="80">ID</th>
                  <th>Nombre</th>
                  <th>Ruta</th>
                  <th>Orden</th>
                </tr>
              </thead>
              <tbody>
                <!-- Las filas de la tabla de paradas se agregarán dinámicamente -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="/js/login.js"></script>
    <script src="/js/viewer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
