<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Paradas | Panel de Administración</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <style>
      :root {
        --sidebar-width: 250px;
        --primary-color: #3498db;
        --secondary-color: #2c3e50;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f5f7fa;
      }

      .sidebar {
        width: var(--sidebar-width);
        height: 100vh;
        position: fixed;
        left: 0;
        top: 0;
        background-color: var(--secondary-color);
        color: white;
        padding: 20px 0;
        box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        transition: all 0.3s;
        z-index: 1000;
      }

      .sidebar-header {
        padding: 0 20px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .sidebar-menu {
        padding: 20px 0;
      }

      .sidebar-menu a {
        display: block;
        padding: 12px 20px;
        color: rgba(255, 255, 255, 0.8);
        text-decoration: none;
        transition: all 0.3s;
        border-left: 3px solid transparent;
      }

      .sidebar-menu a:hover,
      .sidebar-menu a.active {
        background-color: rgba(255, 255, 255, 0.1);
        color: white;
        border-left: 3px solid var(--primary-color);
      }

      .sidebar-menu i {
        margin-right: 10px;
        font-size: 1.1rem;
      }

      .main-content {
        margin-left: var(--sidebar-width);
        padding: 30px;
        min-height: 100vh;
      }

      .card-admin {
        border: none;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        transition: transform 0.3s, box-shadow 0.3s;
        margin-bottom: 20px;
      }

      .card-admin:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }

      .card-admin .card-icon {
        font-size: 2.5rem;
        margin-bottom: 15px;
        color: var(--primary-color);
      }

      .welcome-header {
        background: linear-gradient(135deg, var(--primary-color), #5dade2);
        color: white;
        padding: 30px;
        border-radius: 10px;
        margin-bottom: 30px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      @media (max-width: 768px) {
        .sidebar {
          width: 0;
          overflow: hidden;
        }

        .sidebar.active {
          width: var(--sidebar-width);
        }

        .main-content {
          margin-left: 0;
        }

        .toggle-sidebar {
          display: block !important;
        }
      }

      .toggle-sidebar {
        display: none;
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 1100;
        background: var(--secondary-color);
        color: white;
        border: none;
        border-radius: 5px;
        padding: 5px 10px;
      }

      .table-responsive {
        border-radius: 10px;
        overflow: hidden;
      }

      .table thead {
        background-color: var(--primary-color);
        color: white;
      }

      .badge-route {
        padding: 5px 10px;
        border-radius: 20px;
        font-weight: 500;
      }

      .route-map {
        height: 300px;
        background-color: #e9ecef;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6c757d;
        margin-bottom: 20px;
      }

      .route-stop {
        display: flex;
        align-items: center;
        padding: 8px 15px;
        border-left: 3px solid var(--primary-color);
        margin-bottom: 5px;
        background-color: #f8f9fa;
        border-radius: 5px;
      }

      .route-stop .stop-order {
        font-weight: bold;
        margin-right: 15px;
        color: var(--primary-color);
      }

      .action-btns .btn {
        padding: 5px 10px;
        margin-right: 5px;
      }

      .toggle-sidebar {
        display: none;
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 1100;
        background: var(--secondary-color);
        color: white;
        border: none;
        border-radius: 5px;
        padding: 5px 10px;
      }
    </style>
  </head>
  <body>
    <button class="toggle-sidebar" id="toggleSidebar">
      <i class="bi bi-list"></i>
    </button>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h4 class="text-center">Panel de Control</h4>
      </div>
      <div class="sidebar-menu">
        <a href="" onclick="checkUserRole()" class="active">
          <i class="bi bi-speedometer2"></i> Dashboard
        </a>

        <!-- Ajuste en los botones de gestionar rutas y paradas -->
        <button
          id="gestionarRutasBtn"
          class="btn btn-outline-primary d-block w-100 text-start mt-2"
        >
          <i class="bi bi-bus-front me-2"></i> Gestionar Rutas
        </button>

        <button
          id="gestionarParadasBtn"
          class="btn btn-outline-primary d-block w-100 text-start mt-2"
        >
          <i class="bi bi-signpost me-2"></i> Gestionar Paradas
        </button>

        <a
          href="#"
          onclick="logout(event)"
          class="btn btn-outline-danger d-block w-100 text-start mt-2"
        >
          <i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión
        </a>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-signpost me-2"></i> Gestión de Paradas</h2>
        <div>
          <button class="btn btn-outline-secondary me-2" id="btnFiltrar">
            <i class="bi bi-funnel"></i> Filtrar
          </button>
          <button class="btn btn-outline-danger me-2" id="btnLimpiarFiltros">
            <i class="bi bi-eraser"></i> Limpiar
          </button>
          <button
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#addStopModal"
          >
            <i class="bi bi-plus-lg me-2"></i>Agregar Parada
          </button>
        </div>
      </div>

      <!-- Filtros -->
      <div class="card-admin card mb-4 p-3">
        <div class="row">
          <div class="col-md-4">
            <label for="filtroNombre" class="form-label"
              >Buscar por nombre</label
            >
            <input
              type="text"
              class="form-control"
              id="filtroNombre"
              placeholder="Nombre de parada o ubicación"
            />
          </div>
          <div class="col-md-4">
            <label for="filtroRuta" class="form-label">Filtrar por ruta</label>
            <select class="form-select" id="filtroRuta">
              <option value="">Todas las rutas</option>
              <!-- Las opciones se llenarán dinámicamente -->
            </select>
          </div>
          <div class="col-md-4">
            <label for="filtroTipo" class="form-label">Tipo de punto</label>
            <select class="form-select" id="filtroTipo">
              <option value="">Todos los tipos</option>
              <option value="Domicilio">Domicilio</option>
              <option value="Carretera">Carretera</option>
              <option value="Lugar">Lugar</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Lista de Paradas -->
      <div class="card-admin card p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0" id="tablaParadas">
            <thead>
              <tr>
                <th width="80">ID</th>
                <th>Nombre</th>
                <th>Ubicación</th>
                <th>Orden</th>
                <th>Ruta</th>
                <th>Tipo</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <!-- Las filas de la tabla se agregarán dinámicamente aquí -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/login.js"></script>
    <script src="/js/paradas.js"></script>
  </body>
</html>
