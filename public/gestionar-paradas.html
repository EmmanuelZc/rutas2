<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Paradas | Panel de Administración</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mdi/font@6.9.96/css/materialdesignicons.min.css"
    />
    <style>
      :root {
        --sidebar-width: 250px;
        --primary-color: #3498db;
        --secondary-color: #2c3e50;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f5f7fa;
      }

      .sidebar {
        width: var(--sidebar-width);
        height: 100vh;
        position: fixed;
        left: 0;
        top: 0;
        background-color: var(--secondary-color);
        color: white;
        padding: 20px 0;
        box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        transition: all 0.3s;
        z-index: 1000;
      }

      .sidebar-header {
        padding: 0 20px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .sidebar-menu {
        padding: 20px 0;
      }

      .sidebar-menu a {
        display: block;
        padding: 12px 20px;
        color: rgba(255, 255, 255, 0.8);
        text-decoration: none;
        transition: all 0.3s;
        border-left: 3px solid transparent;
      }

      .sidebar-menu a:hover,
      .sidebar-menu a.active {
        background-color: rgba(255, 255, 255, 0.1);
        color: white;
        border-left: 3px solid var(--primary-color);
      }

      .sidebar-menu i {
        margin-right: 10px;
        font-size: 1.1rem;
      }

      .main-content {
        margin-left: var(--sidebar-width);
        padding: 30px;
        min-height: 100vh;
      }

      .card-admin {
        border: none;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        transition: transform 0.3s, box-shadow 0.3s;
        margin-bottom: 20px;
      }

      .card-admin:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      }

      .card-admin .card-icon {
        font-size: 2.5rem;
        margin-bottom: 15px;
        color: var(--primary-color);
      }

      .welcome-header {
        background: linear-gradient(135deg, var(--primary-color), #5dade2);
        color: white;
        padding: 30px;
        border-radius: 10px;
        margin-bottom: 30px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      @media (max-width: 768px) {
        .sidebar {
          width: 0;
          overflow: hidden;
        }

        .sidebar.active {
          width: var(--sidebar-width);
        }

        .main-content {
          margin-left: 0;
        }

        .toggle-sidebar {
          display: block !important;
        }
      }

      .toggle-sidebar {
        display: none;
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 1100;
        background: var(--secondary-color);
        color: white;
        border: none;
        border-radius: 5px;
        padding: 5px 10px;
      }

      :root {
        --sidebar-width: 250px;
        --primary-color: #3498db;
        --secondary-color: #2c3e50;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;

      }

      .table-responsive {
        border-radius: 10px;
        overflow: hidden;
      }

      .table thead {
        background-color: var(--primary-color);
        color: white;
      }

      .badge-route {
        padding: 5px 10px;
        border-radius: 20px;
        font-weight: 500;
      }

      .route-map {
        height: 300px;
        background-color: #e9ecef;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6c757d;
        margin-bottom: 20px;
      }

      .route-stop {
        display: flex;
        align-items: center;
        padding: 8px 15px;
        border-left: 3px solid var(--primary-color);
        margin-bottom: 5px;
        background-color: #f8f9fa;
        border-radius: 5px;
      }

      .route-stop .stop-order {
        font-weight: bold;
        margin-right: 15px;
        color: var(--primary-color);
      }

      .action-btns .btn {
        padding: 5px 10px;
        margin-right: 5px;
      }

      @media (max-width: 768px) {
        .sidebar {
          width: 0;
          overflow: hidden;
        }

        .sidebar.active {
          width: var(--sidebar-width);
        }

        .main-content {
          margin-left: 0;
        }

        .toggle-sidebar {
          display: block !important;
        }
      }

      .toggle-sidebar {
        display: none;
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 1100;
        background: var(--secondary-color);
        color: white;
        border: none;
        border-radius: 5px;
        padding: 5px 10px;
      }

      /* Estilos adicionales para el modal mejorado */
      #addRouteModal .modal-content {
        border-radius: 0.75rem;
        box-shadow: 0 0.5rem 1.5rem rgba(0, 0, 0, 0.2);
      }

      #addRouteModal .modal-header {
        border-radius: 0.75rem 0.75rem 0 0;
        padding: 1.25rem 1.5rem;
      }

      #addRouteModal .form-label {
        font-weight: 500;
        margin-bottom: 0.5rem;
      }

      #addRouteModal .form-control,
      #addRouteModal .form-select {
        border-radius: 0.5rem;
        padding: 0.5rem 1rem;
        border: 1px solid #ced4da;
        transition: all 0.2s;
      }

      #addRouteModal .form-control:focus,
      #addRouteModal .form-select:focus {
        border-color: #86b7fe;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
      }

      #addRouteModal .invalid-feedback {
        font-size: 0.85rem;
      }

      #addRouteModal .border-primary {
        opacity: 0.3;
      }

      #addRouteModal .btn-outline-secondary:hover {
        background-color: #f8f9fa;
      }

      #addRouteModal .btn-primary {
        padding: 0.5rem 1.5rem;
      }

      /* Estilo para campos requeridos */
      .form-label.required::after {
        content: " *";
        color: #dc3545;
      }

        --sidebar-width: 250px;
        --primary-color: #3498db;
        --secondary-color: #2c3e50;
      }

        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;

      }

      }

        background-color: var(--primary-color);
        color: white;
      }

      .badge-route {
        padding: 5px 10px;
        border-radius: 20px;
        font-weight: 500;
      }

      .route-map {
        height: 300px;
        background-color: #e9ecef;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6c757d;
        margin-bottom: 20px;
      }

      .action-btns .btn {
        padding: 5px 10px;
        margin-right: 5px;
      }

      @media (max-width: 768px) {
        .sidebar {
          width: 0;
          overflow: hidden;
        }

        .sidebar.active {
          width: var(--sidebar-width);
        }

        .main-content {
          margin-left: 0;
        }

        .toggle-sidebar {
          display: block !important;
        }
      }

      .toggle-sidebar {
        display: none;
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 1100;
        background: var(--secondary-color);
        color: white;
        border: none;
        border-radius: 5px;
        padding: 5px 10px;
      }

      /* Estilos para los campos de ubicación */
      .location-fields {
        display: none;
      }
      .location-fields.active {
        display: block;
      }
    </style>
  </head>
  <body>
    <button class="toggle-sidebar" id="toggleSidebar">
      <i class="bi bi-list"></i>
    </button>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h4 class="text-center">Panel de Control</h4>
      </div>
      <div class="sidebar-menu">
        <a href="" onclick="checkUserRole()">
          <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <a href="" class="active" onclick="gestionarRutas(event)">
          <i class="bi bi-bus-front"></i> Gestionar Rutas
        </a>
        <a href="" onclick="gestionarParadas(event)">
          <i class="bi bi-signpost"></i> Gestionar Paradas
        </a>
        <a href="usuarios.html">
          <i class="bi bi-people"></i> Gestionar Usuarios
        </a>

        <a href="#" onclick="logout(event)">
          <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
        </a>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-signpost me-2"></i> Gestión de Paradas</h2>
        <div>
          <button class="btn btn-outline-secondary me-2" id="btnFiltrar">
            <i class="bi bi-funnel"></i> Filtrar
          </button>
          <button class="btn btn-outline-danger me-2" id="btnLimpiarFiltros">
            <i class="bi bi-eraser"></i> Limpiar
          </button>
          <button
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#addStopModal"
          >
            <i class="bi bi-plus-lg me-2"></i>Agregar Parada
          </button>
        </div>
      </div>

      <!-- Filtros -->
      <div class="card-admin card mb-4 p-3">
        <div class="row">
          <div class="col-md-4">
            <label for="filtroNombre" class="form-label"
              >Buscar por nombre</label
            >
            <input
              type="text"
              class="form-control"
              id="filtroNombre"
              placeholder="Nombre de parada o ubicación"
            />
          </div>
          <div class="col-md-4">
            <label for="filtroRuta" class="form-label">Filtrar por ruta</label>
            <select class="form-select" id="filtroRuta">
              <option value="">Todas las rutas</option>
              <!-- Las opciones se llenarán dinámicamente -->
            </select>
          </div>
          <div class="col-md-4">
            <label for="filtroTipo" class="form-label">Tipo de punto</label>
            <select class="form-select" id="filtroTipo">
              <option value="">Todos los tipos</option>
              <option value="Domicilio">Domicilio</option>
              <option value="Carretera">Carretera</option>
              <option value="Lugar">Lugar</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Lista de Paradas -->
      <div class="card-admin card p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0" id="tablaParadas">
            <thead>
              <tr>
                <th width="80">ID</th>
                <th>Nombre</th>
                <th>Ubicación</th>
                <th>Orden</th>
                <th>Ruta</th>
                <th>Tipo</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              <!-- Las filas de la tabla se agregarán dinámicamente aquí -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Modal Agregar/Editar Parada -->
    <div
      class="modal fade"
      id="addStopModal"
      tabindex="-1"
      aria-labelledby="addStopModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title" id="addStopModalLabel">
              Agregar Nueva Parada
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="formAgregarParada">
              <div class="row mb-3">
                <div class="col-md-6">
                  <label class="form-label">Nombre de Parada*</label>
                  <input
                    type="text"
                    class="form-control"
                    id="nombreParada"
                    placeholder="Ej: Parada Centro-Comercial"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Orden*</label>
                  <input
                    type="number"
                    class="form-control"
                    id="ordenParada"
                    placeholder="Ej: 1"
                    required
                    min="1"
                  />
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-md-6">
                  <label class="form-label">Ruta*</label>
                  <select class="form-select" id="rutaIdParada" required>
                    <option value="">Seleccione una ruta</option>
                    <!-- Las opciones se llenarán dinámicamente -->
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Tipo de Punto*</label>
                  <select
                    class="form-select"
                    id="tipoPuntoParada"
                    required
                    onchange="mostrarCamposUbicacion()"
                  >
                    <option value="Domicilio">Domicilio</option>
                    <option value="Carretera">Carretera</option>
                    <option value="Lugar">Lugar</option>
                  </select>
                </div>
              </div>

              <!-- Campos de ubicación - Domicilio -->
              <div id="domicilioFields" class="location-fields">
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label">Calle*</label>
                    <input
                      type="text"
                      class="form-control"
                      id="calleParada"
                      placeholder="Nombre de la calle"
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Número*</label>
                    <input
                      type="text"
                      class="form-control"
                      id="numeroParada"
                      placeholder="Número exterior"
                    />
                  </div>
                </div>
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label">Colonia*</label>
                    <input
                      type="text"
                      class="form-control"
                      id="coloniaParada"
                      placeholder="Nombre de la colonia"
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Ciudad*</label>
                    <input
                      type="text"
                      class="form-control"
                      id="ciudadParada"
                      placeholder="Nombre de la ciudad"
                    />
                  </div>
                </div>
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label">Código Postal</label>
                    <input
                      type="text"
                      class="form-control"
                      id="cpParada"
                      placeholder="Código postal"
                    />
                  </div>
                </div>
              </div>

              <!-- Campos de ubicación - Carretera -->
              <div id="carreteraFields" class="location-fields">
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label">Nombre de Carretera*</label>
                    <input
                      type="text"
                      class="form-control"
                      id="carreteraParada"
                      placeholder="Nombre de la carretera"
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Kilómetro*</label>
                    <input
                      type="text"
                      class="form-control"
                      id="kmParada"
                      placeholder="Kilómetro de la parada"
                    />
                  </div>
                </div>
              </div>

              <!-- Campos de ubicación - Lugar -->
              <div id="lugarFields" class="location-fields">
                <div class="row mb-3">
                  <div class="col-md-12">
                    <label class="form-label">Descripción del Lugar*</label>
                    <textarea
                      class="form-control"
                      id="descripcionParada"
                      placeholder="Descripción detallada del lugar"
                      rows="3"
                    ></textarea>
                  </div>
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-md-6">
                  <label class="form-label">Latitud*</label>
                  <input
                    type="number"
                    step="any"
                    class="form-control"
                    id="latitudParada"
                    placeholder="Ej: 19.432608"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Longitud*</label>
                  <input
                    type="number"
                    step="any"
                    class="form-control"
                    id="longitudParada"
                    placeholder="Ej: -99.133209"
                    required
                  />
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-md-6">
                  <label class="form-label">Horario de Apertura</label>
                  <input
                    type="time"
                    class="form-control"
                    id="horarioAperturaParada"
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Horario de Cierre</label>
                  <input
                    type="time"
                    class="form-control"
                    id="horarioCierreParada"
                  />
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-md-6">
                  <label class="form-label">Tipo de Transporte</label>
                  <input
                    type="text"
                    class="form-control"
                    id="tipoTransporteParada"
                    placeholder="Ej: Camión"
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Capacidad Máxima</label>
                  <input
                    type="number"
                    class="form-control"
                    id="capacidadMaximaParada"
                    placeholder="Ej: 50"
                    min="0"
                  />
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-md-6">
                  <div class="form-check">
                    <input
                      type="checkbox"
                      class="form-check-input"
                      id="accesoDiscapacitadosParada"
                    />
                    <label
                      class="form-check-label"
                      for="accesoDiscapacitadosParada"
                    >
                      Acceso para Discapacitados
                    </label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-check">
                    <input
                      type="checkbox"
                      class="form-check-input"
                      id="areaDescansoParada"
                    />
                    <label class="form-check-label" for="areaDescansoParada">
                      Área de Descanso
                    </label>
                  </div>
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-md-6">
                  <label class="form-label">Servicios Adicionales</label>
                  <textarea
                    class="form-control"
                    id="serviciosAdicionalesParada"
                    placeholder="Servicios adicionales disponibles"
                    rows="2"
                  ></textarea>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Contacto</label>
                  <input
                    type="text"
                    class="form-control"
                    id="contactoParada"
                    placeholder="Ej: parada@centro.com"
                  />
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-md-6">
                  <div class="form-check">
                    <input
                      type="checkbox"
                      class="form-check-input"
                      id="zonaPeatonalParada"
                    />
                    <label class="form-check-label" for="zonaPeatonalParada">
                      Zona Peatonal
                    </label>
                  </div>
                </div>
              </div>

              <div class="modal-footer">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  class="btn btn-primary"
                  id="guardarParadaBtn"
                >
                  Guardar Parada
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/login.js"></script>
    <script src="/js/paradas.js"></script>
  </body>
</html>
