<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Rutas</title>

    <!-- Incluir Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome para iconos -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        --primary-color: #2c3e50;
        --secondary-color: #3498db;
        --accent-color: #e74c3c;
        --light-color: #ecf0f1;
        --dark-color: #2c3e50;
        --success-color: #27ae60;
      }

      body {
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        font-family: "Poppins", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
      }

      .logo-container {
        text-align: center;
        margin-bottom: 2rem;
      }

      .logo {
        width: 80px;
        height: 80px;
        background-color: var(--secondary-color);
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 2rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .card {
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        border: none;
        overflow: hidden;
        margin-top: 20px;
      }

      .card-header {
        background-color: var(--primary-color);
        color: white;
        text-align: center;
        padding: 1.5rem;
        border-bottom: none;
      }

      .card-header h2 {
        font-weight: 600;
        margin: 0;
      }

      .card-body {
        padding: 2.5rem;
        background-color: white;
      }

      .card-text {
        color: #7f8c8d;
        margin-bottom: 2rem;
        text-align: center;
      }

      .btn-primary-custom {
        background-color: var(--secondary-color);
        color: white;
        font-weight: 500;
        border-radius: 50px;
        padding: 12px 24px;
        width: 100%;
        border: none;
        transition: all 0.3s ease;
        letter-spacing: 0.5px;
      }

      .btn-primary-custom:hover {
        background-color: #2980b9;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      .btn-outline-custom {
        border-radius: 50px;
        padding: 12px 24px;
        width: 100%;
        border: 2px solid var(--secondary-color);
        color: var(--secondary-color);
        font-weight: 500;
        transition: all 0.3s ease;
        letter-spacing: 0.5px;
      }

      .btn-outline-custom:hover {
        background-color: var(--secondary-color);
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      .modal-content {
        border-radius: 20px;
        border: none;
        overflow: hidden;
      }

      .modal-header {
        background-color: var(--primary-color);
        color: white;
        border-bottom: none;
        padding: 1.5rem;
      }

      .modal-title {
        font-weight: 600;
      }

      .form-label {
        font-weight: 500;
        color: var(--dark-color);
        margin-bottom: 0.5rem;
      }

      .form-control {
        border-radius: 10px;
        padding: 12px 15px;
        border: 1px solid #ddd;
        transition: all 0.3s;
      }

      .form-control:focus {
        border-color: var(--secondary-color);
        box-shadow: 0 0 0 0.25rem rgba(52, 152, 219, 0.25);
      }

      .modal-body {
        padding: 2rem;
      }

      .input-group-text {
        background-color: var(--light-color);
        border: 1px solid #ddd;
      }

      .footer-links {
        text-align: center;
        margin-top: 2rem;
        font-size: 0.9rem;
      }

      .footer-links a {
        color: var(--secondary-color);
        text-decoration: none;
        margin: 0 10px;
      }

      .footer-links a:hover {
        text-decoration: underline;
      }

      .feature-icon {
        color: var(--secondary-color);
        font-size: 1.5rem;
        margin-right: 10px;
      }

      .features-container {
        margin-top: 2rem;
      }

      .feature-item {
        display: flex;
        align-items: center;
        margin-bottom: 1rem;
        color: #34495e;
      }

      .divider {
        display: flex;
        align-items: center;
        margin: 1.5rem 0;
        color: #bdc3c7;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid #bdc3c7;
      }

      .divider::before {
        margin-right: 1rem;
      }

      .divider::after {
        margin-left: 1rem;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <!-- Tarjeta de Bienvenida -->
          <div class="card shadow-lg">
            <div class="card-header">
              <h2><i class="fas fa-route me-2"></i> Rutas</h2>
            </div>
            <div class="card-body text-center">
              <div class="logo-container">
                <div class="logo">
                  <i class="fas fa-bus"></i>
                </div>
              </div>
              <h3 class="mb-3">Gestión de Rutas</h3>
              <p class="card-text">
                Agrega y gestiona rutas de transporte de manera eficiente y
                sencilla.
              </p>

              <!-- Botones de Inicio de sesión y Registro -->
              <button
                class="btn btn-primary-custom mb-3"
                data-bs-toggle="modal"
                data-bs-target="#loginModal"
              >
                <i class="fas fa-sign-in-alt me-2"></i> Iniciar Sesión
              </button>

              <div class="divider">o</div>

              <button
                class="btn btn-outline-custom"
                data-bs-toggle="modal"
                data-bs-target="#registerModal"
              >
                <i class="fas fa-user-plus me-2"></i> Crear Cuenta
              </button>

              <div class="features-container mt-4">
                <div class="feature-item">
                  <i class="fas fa-map-marked-alt feature-icon"></i>
                  <span>Visualización de rutas</span>
                </div>
                <div class="feature-item">
                  <i class="fas fa-cogs feature-icon"></i>
                  <span>Visualización de paradas</span>
                </div>
                <div class="feature-item">
                  <i class="fas fa-chart-line feature-icon"></i>
                  <span>Gestiona rutas</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal de Iniciar Sesión -->
      <div
        class="modal fade"
        id="loginModal"
        tabindex="-1"
        aria-labelledby="loginModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">
                <i class="fas fa-sign-in-alt me-2"></i> Iniciar Sesión
              </h5>
              <button
                type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <form id="loginForm">
                <div class="mb-3">
                  <label for="loginEmail" class="form-label"
                    >Correo Electrónico</label
                  >
                  <div class="input-group">
                    <span class="input-group-text"
                      ><i class="fas fa-envelope"></i
                    ></span>
                    <input
                      type="email"
                      class="form-control"
                      id="loginEmail"
                      placeholder="tu@email.com"
                      required
                    />
                  </div>
                </div>
                <div class="mb-4">
                  <label for="loginPassword" class="form-label"
                    >Contraseña</label
                  >
                  <div class="input-group">
                    <span class="input-group-text"
                      ><i class="fas fa-lock"></i
                    ></span>
                    <input
                      type="password"
                      class="form-control"
                      id="loginPassword"
                      placeholder="••••••••"
                      autocomplete="current-password"
                      required
                    />
                  </div>
                  <div class="text-end mt-2">
                    <a
                      href="#"
                      class="text-decoration-none"
                      style="color: var(--secondary-color); font-size: 0.85rem"
                      >¿Olvidaste tu contraseña?</a
                    >
                  </div>
                </div>
                <button type="submit" class="btn btn-primary-custom mb-3">
                  Ingresar
                </button>
                <div class="text-center">
                  <span class="text-muted">¿No tienes cuenta?</span>
                  <a
                    href="#"
                    class="text-decoration-none"
                    data-bs-toggle="modal"
                    data-bs-target="#registerModal"
                    data-bs-dismiss="modal"
                    style="color: var(--secondary-color)"
                  >
                    Regístrate aquí</a
                  >
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal de Registro -->
      <div
        class="modal fade"
        id="registerModal"
        tabindex="-1"
        aria-labelledby="registerModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">
                <i class="fas fa-user-plus me-2"></i> Crear Cuenta
              </h5>
              <button
                type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <form id="registerForm">
                <div class="mb-3">
                  <label for="registerUsername" class="form-label"
                    >Nombre de Usuario</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="registerUsername"
                    placeholder="Nombre de usuario"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="registerEmail" class="form-label"
                    >Correo Electrónico</label
                  >
                  <input
                    type="email"
                    class="form-control"
                    id="registerEmail"
                    placeholder="tu@email.com"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="registerPassword" class="form-label"
                    >Contraseña</label
                  >
                  <input
                    type="password"
                    class="form-control"
                    id="registerPassword"
                    placeholder="••••••••"
                    autocomplete="new-password"
                    required
                  />
                </div>
                <div class="mb-4">
                  <label for="registerRole" class="form-label"
                    >Tipo de Cuenta</label
                  >
                  <select class="form-select" id="registerRole">
                    <option value="Editor">Editor de Rutas</option>
                    <option value="Administrador">Administrador</option>
                    <option value="Visualizador">Solo Visualización</option>
                  </select>
                </div>
                <button type="submit" class="btn btn-primary-custom mb-3">
                  Registrarse
                </button>
                <div class="text-center">
                  <span class="text-muted">¿Ya tienes cuenta?</span>
                  <a
                    href="#"
                    class="text-decoration-none"
                    data-bs-toggle="modal"
                    data-bs-target="#loginModal"
                    data-bs-dismiss="modal"
                    style="color: var(--secondary-color)"
                  >
                    Inicia sesión aquí
                  </a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="/js/registro.js"></script>
    <!-- Incluir Bootstrap JS y Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
    <script src="./js/login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>
  </body>
</html>
